<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      {{.FontFaceCss}}

      :root {
        --bg: #f4efe6;
        --fg: #111111;
        --muted: rgba(17, 17, 17, 0.68);
        --line: rgba(17, 17, 17, 0.11);
        --soft: rgba(17, 17, 17, 0.04);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
      }

      body {
        font-family: "DM Sans", "DM Sans Fallback", sans-serif;
        color: var(--fg);
        text-rendering: geometricPrecision;
      }

      .canvas {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 44px;
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.4), transparent 42%),
          linear-gradient(180deg, #f7f2ea 0%, #f2ede3 100%);
      }

      .canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid var(--line);
        pointer-events: none;
      }

      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.26;
        background-image:
          linear-gradient(rgba(17, 17, 17, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(17, 17, 17, 0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(circle at center, black 42%, transparent 92%);
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 28px;
        height: 100%;
      }

      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .site-only {
        display: none;
      }

      .variant-site .content {
        justify-content: center;
        align-items: center;
      }

      .variant-site .main {
        align-items: center;
        justify-content: center;
        flex: 1;
        width: 100%;
        text-align: center;
      }

      .variant-site .note-only {
        display: none;
      }

      .variant-site .site-only {
        display: block;
      }

      .variant-site h1 {
        max-width: 12ch;
        font-size: 92px;
      }

      .variant-site .tags {
        justify-content: center;
        margin-top: 22px;
      }

      h1 {
        margin: 0;
        max-width: 30ch;
        font-size: 72px;
        line-height: 0.96;
        letter-spacing: -0.06em;
        font-weight: 700;
        display: -webkit-box;
      }

      .description {
        width: 100%;
        max-width: 42ch;
        margin: 18px 0 0;
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        font-size: 27px;
        line-height: 1.24;
        letter-spacing: -0.03em;
        color: rgba(17, 17, 17, 0.78);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 26px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(17, 17, 17, 0.82);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        justify-content: space-between;
        font-size: 15px;
        color: var(--muted);
      }

      .meta strong {
        color: var(--fg);
        font-weight: 600;
      }
    </style>
  </head>
  <body class="{{.VariantClass}}">
    <div class="canvas">
      <div class="grid"></div>

      <div class="content">
        <section class="main">
          <div class="note-only">
            <h1>{{.Title}}</h1>
            <p class="description">{{.Description}}</p>
            <div class="tags">{{.TagsMarkup}}</div>
          </div>

          <div class="site-only">
            <h1>{{.Title}}</h1>
            <div class="tags">{{.TagsMarkup}}</div>
          </div>
        </section>

        <div class="meta note-only">
          <div>
            <span><strong>{{.Date}}</strong></span>
            <span>&middot;</span>
            <span>{{.ReadingTime}}</span>
          </div>
          <span>{{.SiteName}}</span>
        </div>
      </div>
    </div>
  </body>
</html>
