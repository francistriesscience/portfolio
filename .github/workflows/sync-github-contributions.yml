name: Sync GitHub Contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync GitHub contributions JSON
        run: bun run --cwd apps/web sync:github-contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
          GITHUB_USERNAME: "francistriesscience"

      - name: Commit updated graph data
        run: |
          if git diff --quiet -- apps/web/public/graph/github-contributions.json; then
            echo "No graph data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/graph/github-contributions.json
          git commit -m "chore: sync GitHub contributions"
          git push
